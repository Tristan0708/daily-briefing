jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Coze API
        run: |
          curl -sS --location 'https://t8m9nthty5.coze.site/run' \
            --header "Authorization: Bearer ${{ secrets.COZE_API_TOKEN }}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --max-time 300 \
            -w '\nHTTP状态码: %{http_code}\n'
